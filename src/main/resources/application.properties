spring.application.name=a3-anima-gestao_financeira

# Importa as variaveis do arquivo .env (se ele existir)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:db.ticufuziiqrnehgleeht.supabase.co}:5432/${DB_NAME:postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Resiliência de Conexão com Banco na Nuvem (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jpa.properties.hibernate.session_factory.statement_inspector=br.com.a3.config.SqlStatementInterceptor

app.seed.enabled=true
app.admin.username=${ADMIN_USERNAME:a3_admin_2026}
