<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Gestão Financeira A3</title>
  <meta name="description" content="Acesso ao sistema de gestão financeira A3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Ctext x='16' y='21' font-size='13' text-anchor='middle' fill='white' font-family='Arial'%3EA3%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-2: #22263a;
      --border: rgba(255,255,255,0.08);
      --accent: #6366f1;
      --accent-hover: #4f52d1;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.08) 0%, transparent 50%);
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
      justify-content: center;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: white;
      box-shadow: 0 4px 20px rgba(99,102,241,0.4);
    }

    .brand-text .brand-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .brand-text .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.4);
    }

    .login-card h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-card .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
      color: #86efac;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }

    .form-input::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-login:hover  { opacity: 0.9; }
    .btn-login:active { transform: scale(0.98); }

    .login-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-brand">
      <div class="brand-icon">A3</div>
      <div class="brand-text">
        <div class="brand-name">Gestão Financeira</div>
        <div class="brand-sub">A3 — Painel de Controle</div>
      </div>
    </div>

    <div class="login-card">
      <h1>Bem-vindo</h1>
      <p class="subtitle">Insira suas credenciais de acesso ao sistema.</p>

      <div id="alert-error" class="alert alert-error" style="display:none">
        ⚠️ Usuário ou senha incorretos. Tente novamente.
      </div>
      <div id="alert-logout" class="alert alert-success" style="display:none">
        ✅ Você saiu com sucesso.
      </div>

      <form method="post" action="/login" id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Usuário</label>
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            placeholder="nome de usuário"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn-login" id="btn-entrar">Entrar</button>
      </form>

      <hr class="divider">
      <div class="login-footer">
        Spring Boot 4 &nbsp;|&nbsp; H2 em arquivo &nbsp;|&nbsp; A3 — Ânima Educação
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'true') {
      document.getElementById('alert-error').style.display = 'flex';
    }
    if (params.get('logout') === 'true') {
      document.getElementById('alert-logout').style.display = 'flex';
    }
    document.getElementById('login-form').addEventListener('submit', function() {
      const btn = document.getElementById('btn-entrar');
      btn.textContent = 'Entrando...';
      btn.disabled = true;
    });
  </script>
</body>
</html>
