name: Keep Supabase Database Alive

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
        
      - name: Ping Supabase Database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set, skipping ping..."
            exit 0
          fi
          echo "Pinging database to keep it alive..."
          
          # Retry logic with exponential backoff
          for i in {1..3}; do
            if psql "$DATABASE_URL" -c "SELECT 1;" 2>/dev/null; then
              echo "Database ping successful!"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Attempt $i failed, retrying in $((i * 10)) seconds..."
              sleep $((i * 10))
            fi
          done
          
          echo "Warning: Could not reach database after 3 attempts"
          exit 0